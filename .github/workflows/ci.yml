name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Inventario de pruebas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Pruebas ejecutadas y documentadas
        run: python3 tools/check_test_inventory.py

  lint:
    name: Lint (archivos nuevos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: GDScript añadido en este cambio
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF}" ]; then
            base="origin/${BASE_REF}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            base="${BEFORE_SHA}"
          else
            base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=A "${base}" HEAD -- '*.gd' ':!:addons/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Sin archivos GDScript nuevos: nada que revisar."
            exit 0
          fi
          printf 'Revisando:\n%s\n' "${files[@]}"
          gdlint "${files[@]}"
          gdformat --check "${files[@]}"

  test:
    name: Pruebas y límites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache de Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Descargar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Importar el proyecto
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --import 2>&1 | tee /tmp/import.log
          python3 tools/check_output.py /tmp/import.log

      - name: Límites de GDScript
        run: python3 tools/check_gdscript_limits.py

      - name: Pruebas automatizadas
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/tests.log
          python3 tools/check_output.py /tmp/tests.log

      - name: Streaming de sectores
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/sector_streaming_check.gd 2>&1 | tee /tmp/streaming.log
          python3 tools/check_output.py /tmp/streaming.log

      - name: Navegación entre sectores
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/navigation_check.gd 2>&1 | tee /tmp/navigation.log
          python3 tools/check_output.py /tmp/navigation.log

      - name: Terrain3D
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/terrain3d_check.gd 2>&1 | tee /tmp/terrain3d.log
          python3 tools/check_output.py /tmp/terrain3d.log

      - name: Sector gris de integración
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/grey_sector_check.gd 2>&1 | tee /tmp/grey_sector.log
          python3 tools/check_output.py /tmp/grey_sector.log

      - name: Streaming y memoria
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/streaming_soak_check.gd 2>&1 | tee /tmp/streaming_soak.log
          python3 tools/check_output.py /tmp/streaming_soak.log

      - name: Región y heightmap
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/region_terrain_check.gd 2>&1 | tee /tmp/region.log
          python3 tools/check_output.py /tmp/region.log

      - name: Región y streaming
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/region_streaming_check.gd 2>&1 | tee /tmp/region_streaming.log
          python3 tools/check_output.py /tmp/region_streaming.log

      - name: Rutas y navmesh
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/route_network_check.gd 2>&1 | tee /tmp/routes.log
          python3 tools/check_output.py /tmp/routes.log

      - name: Blockout de la llacta
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/llacta_blockout_check.gd 2>&1 | tee /tmp/llacta.log
          python3 tools/check_output.py /tmp/llacta.log

      - name: Blockout del Cusco
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/cusco_blockout_check.gd 2>&1 | tee /tmp/cusco.log
          python3 tools/check_output.py /tmp/cusco.log

      - name: Ciudad habitable
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/city_check.gd 2>&1 | tee /tmp/city.log
          python3 tools/check_output.py /tmp/city.log

      - name: Interiores transitables
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/interiors_check.gd 2>&1 | tee /tmp/interiors.log
          python3 tools/check_output.py /tmp/interiors.log

      - name: Ciclo dia y noche
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/day_night_check.gd 2>&1 | tee /tmp/daynight.log
          python3 tools/check_output.py /tmp/daynight.log

      - name: Antorcha de mano
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/lantern_check.gd 2>&1 | tee /tmp/lantern.log
          python3 tools/check_output.py /tmp/lantern.log

      - name: Poblacion de la ciudad
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/city_population_check.gd 2>&1 | tee /tmp/population.log
          python3 tools/check_output.py /tmp/population.log

      - name: Descanso y guardado
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/city_save_round_trip.gd 2>&1 | tee /tmp/save.log
          python3 tools/check_output.py /tmp/save.log

      - name: Dialogo y diario
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/dialogue_check.gd 2>&1 | tee /tmp/dialogue.log
          python3 tools/check_output.py /tmp/dialogue.log

      - name: Mision principal
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/mission_check.gd 2>&1 | tee /tmp/mission.log
          python3 tools/check_output.py /tmp/mission.log

      - name: Curaca en la etapa 2
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/mission_stage2_check.gd 2>&1 | tee /tmp/stage2.log
          python3 tools/check_output.py /tmp/stage2.log

      - name: Actividades secundarias
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/side_activities_check.gd 2>&1 | tee /tmp/side.log
          python3 tools/check_output.py /tmp/side.log

      - name: Mirador de Carmenca
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/mirador_check.gd 2>&1 | tee /tmp/mirador.log
          python3 tools/check_output.py /tmp/mirador.log

      - name: Obras de defensa
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/defense_works_check.gd 2>&1 | tee /tmp/defense.log
          python3 tools/check_output.py /tmp/defense.log

      - name: Combate del jugador
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/combat_check.gd 2>&1 | tee /tmp/combat.log
          python3 tools/check_output.py /tmp/combat.log

      - name: Batalla de Carmenca
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/carmenca_check.gd 2>&1 | tee /tmp/carmenca.log
          python3 tools/check_output.py /tmp/carmenca.log

      - name: Sectores del oeste
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/frontier_sectors_check.gd 2>&1 | tee /tmp/frontera.log
          python3 tools/check_output.py /tmp/frontera.log

      - name: POI y descubrimiento
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/poi_discovery_check.gd 2>&1 | tee /tmp/pois.log
          python3 tools/check_output.py /tmp/pois.log

      - name: Recorrido regional
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/region_walkthrough_check.gd 2>&1 | tee /tmp/walkthrough.log
          python3 tools/check_output.py /tmp/walkthrough.log

      - name: Modo revisión
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/region_review_check.gd 2>&1 | tee /tmp/review.log
          python3 tools/check_output.py /tmp/review.log

      - name: Jugador a pie
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/region_player_check.gd 2>&1 | tee /tmp/player.log
          python3 tools/check_output.py /tmp/player.log

      - name: Geometría flotante del blockout
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tools/blockout_float_audit.gd 2>&1 | tee /tmp/float.log
          python3 tools/check_output.py /tmp/float.log

      - name: LOD de 60 NPC
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/npc_lod_check.gd 2>&1 | tee /tmp/npc_lod.log
          python3 tools/check_output.py /tmp/npc_lod.log

      - name: Blockout de F1.7
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/sector_blockout_check.gd 2>&1 | tee /tmp/sector_blockout.log
          python3 tools/check_output.py /tmp/sector_blockout.log

  export:
    name: Exportar ${{ matrix.preset }}
    needs: [guard, lint, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            output: build/linux/memorias-del-peru.x86_64
          - preset: Windows
            output: build/windows/memorias-del-peru.exe
    steps:
      - uses: actions/checkout@v7

      - name: Cache de Godot y plantillas
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-stable-templates

      - name: Descargar Godot y plantillas
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Importar el proyecto
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --import 2>&1 | tee /tmp/import-export.log
          python3 tools/check_output.py /tmp/import-export.log

      - name: Exportar ${{ matrix.preset }}
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          ~/godot/godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          test -s "${{ matrix.output }}"

      - name: Arrancar el build de Linux
        if: matrix.preset == 'Linux'
        run: timeout 60 ./${{ matrix.output }} --headless --quit-after 10

      - uses: actions/upload-artifact@v7
        with:
          name: memorias-del-peru-${{ matrix.preset }}-${{ github.sha }}
          path: ${{ matrix.output }}
          retention-days: 14
